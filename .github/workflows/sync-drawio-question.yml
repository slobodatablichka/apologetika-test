name: Sync draw.io question prototype
on:
  push:
    branches: [main]
    paths:
      - 'maps/questions/1.1.1.1.drawio'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Convert draw.io into bank JSON
        run: python3 scripts/sync-drawio-question.py
      - name: Validate bank
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('tests/lecture-01-bank.json').read_text(encoding='utf-8'))
          assert len(b['questions']) == 36
          ids=[q['id'] for q in b['questions']]
          assert len(ids)==len(set(ids))
          for q in b['questions']:
              option_ids={o['id'] for o in q['options']}
              assert q['correct'] and set(q['correct']) <= option_ids
              assert 1 <= q['difficulty'] <= 5
          print('Bank OK')
          PY
      - name: Commit updated bank
        run: |
          if git diff --quiet -- tests/lecture-01-bank.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/lecture-01-bank.json
          git commit -m "Sync question 1.1.1.1 from draw.io"
          git push
