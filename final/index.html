<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Апологетика — итоговые тесты</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#233346;font:16px/1.5 system-ui,sans-serif}header{background:#213e5b;color:white;padding:24px max(20px,calc((100vw - 900px)/2))}h1{margin:0;font-size:27px}main{max-width:940px;margin:0 auto;padding:20px 16px 64px}a{color:#175c88}.card{background:#fff;border:1px solid #dce3eb;border-radius:12px;padding:20px;margin:14px 0}label{display:block}select,button{font:inherit;padding:10px 13px;border:1px solid #b9c7d2;border-radius:8px;background:#fff;color:#24364a}select{width:100%}button{cursor:pointer}button.primary{background:#245b75;color:white;border-color:#245b75}button:disabled{opacity:.45;cursor:default}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:#617083;font-size:14px}.option{padding:10px;border:1px solid #e0e7ed;border-radius:8px;margin:9px 0}.option label{display:flex;align-items:flex-start;gap:10px;cursor:pointer}.option input{margin-top:6px}.correct{border-color:#4c9466;background:#effaf2}.wrong{border-color:#b86969;background:#fff3f3}.note{background:#f4f8fc;border-left:4px solid #6b9ab9;padding:12px;margin-top:16px}.hide{display:none}.review{border-top:1px solid #dde3e8;margin-top:16px;padding-top:15px}.review p{margin:5px 0}.score{font-size:24px;font-weight:750}@media(max-width:640px){.grid{grid-template-columns:1fr}header{padding:20px 16px}}
</style></head><body><header><h1>Итоговые тесты</h1></header><main>
<p><a href="../">← Главная</a></p>
<section class="card" id="setup"><div class="grid"><label>Подборка<select id="collection"><option value="1">Подборка 1</option><option value="2">Подборка 2</option><option value="3">Подборка 3</option></select></label><label>Тест<select id="variant"></select></label></div><div class="controls"><button class="primary" id="start">Начать тест</button></div><p class="muted" id="status" role="status"></p></section>
<section class="card hide" id="exam"><div class="muted" id="progress"></div><h2 id="question"></h2><div id="options"></div><div id="alert" role="alert" class="muted"></div><div id="feedback" class="note hide"></div><div class="controls"><button id="check" class="primary">Проверить</button><button id="next" disabled>Следующий вопрос →</button><button id="exit">К выбору теста</button></div></section>
<section class="card hide" id="results"></section>
</main><script src="final-tests.js" defer></script></body></html>
